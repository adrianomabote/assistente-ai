services:
  - type: web
    name: zapmcrm
    runtime: node
    region: frankfurt  # muda para a região mais próxima de ti
    plan: starter      # starter (pago) tem disco persistente; free não tem

    buildCommand: |
      npm install vite @vitejs/plugin-react react react-dom tailwindcss autoprefixer postcss socket.io-client axios --ignore-scripts
      npm run build
      npm install --ignore-scripts

    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        generateValue: false   # define manualmente no dashboard do Render
        # Coloca a tua senha em: Dashboard → Environment → APP_PASSWORD
      - key: DATA_DIR
        value: /data

    disk:
      name: zapmcrm-data
      mountPath: /data
      sizeGB: 1
