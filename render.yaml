services:
  - type: web
    name: zapmcrm
    runtime: node
    region: frankfurt

    buildCommand: npm install && npm run build

    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        generateValue: false
      - key: DATA_DIR
        value: /data

    disk:
      name: zapmcrm-data
      mountPath: /data
      sizeGB: 1
